[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "science-assistant"
version = "0.2.22"
description = "MCP scientific data gateway for astroquery, TAP/ADQL, and file downloads"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Vasiliy Zdanovskiy", email = "vasilyvz@gmail.com"}]
dependencies = [
  "mcp-proxy-adapter>=8.10.25,<9",
  "astroquery>=0.4.11,<0.5",
  "astropy>=7,<8",
  "pyvo>=1.9,<2",
  "pandas>=2.3,<3",
  "pyarrow>=25,<26",
  "httpx>=0.28,<1",
  "code-analysis-client>=1.6.95,<2"
]

[project.scripts]
science-assistant-server = "science_assistant.server:main"
pipeline = "pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["science_assistant*", "pipeline*"]

[tool.setuptools.package-data]
science_assistant = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
